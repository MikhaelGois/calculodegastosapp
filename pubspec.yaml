name: calculodegastosapp
description: "Aplicativo de cálculo de gastos de frota de veículos com UI moderna."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  animations: ^2.0.11
  fl_chart: ^0.65.0
  uuid: ^4.1.0
  url_launcher: ^6.2.0
  geolocator: ^9.0.2
  geocoding: ^2.1.1
  shared_preferences: ^2.2.2
  camera: ^0.10.5
  video_player: ^2.7.0
  permission_handler: ^11.4.4
  path_provider: ^2.1.1
  gallery_saver: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

